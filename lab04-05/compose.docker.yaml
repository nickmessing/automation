# Docker only: systemd in test-server needs the host's cgroup tree and tmpfs
# mounts that podman sets up by itself.
#   docker compose -f compose.yaml -f compose.docker.yaml up -d --build
services:
  test-server:
    cgroup: host
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
